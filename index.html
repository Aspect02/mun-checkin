<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Model UN Check-In</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #071a33;

      color:
        white;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      padding:
        24px;
    }


    .app {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }


    .logo {
      font-size: 18px;
      letter-spacing: 4px;
      opacity: 0.75;
      margin-bottom: 8px;
    }


    h1 {
      margin:
        0 0 8px 0;

      font-size:
        42px;
    }


    #systemStatus {
      margin-bottom: 24px;
      font-size: 18px;
    }


    .ready {
      color: #6ee7a0;
    }


    .camera-container {

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background:
        black;

      border:
        2px solid
        rgba(255,255,255,0.25);
    }


    video {

      display: block;

      width: 100%;

      aspect-ratio: 16 / 9;

      object-fit: cover;
    }


    .scan-guide {

      position: absolute;

      left: 10%;
      right: 10%;

      top: 34%;

      height: 32%;

      border:
        3px solid
        rgba(255,255,255,0.95);

      border-radius:
        12px;

      pointer-events:
        none;
    }


    .scan-line {

      position: absolute;

      left: 12%;
      right: 12%;

      top: 50%;

      height: 3px;

      background:
        #ff5656;

      box-shadow:
        0 0 8px
        rgba(255,86,86,0.7);

      pointer-events:
        none;
    }


    .instruction {

      margin-top: 18px;

      font-size: 20px;
    }


    #result {

      margin-top: 24px;

      padding: 22px;

      min-height: 120px;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.08);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;
    }


    .student-name {

      font-size: 34px;

      font-weight: bold;

      margin-bottom: 8px;
    }


    .event {

      font-size: 20px;

      margin-bottom: 8px;
    }


    .points {

      font-size: 36px;

      font-weight: bold;

      color:
        #70e89e;
    }


    .timestamp {

      margin-top: 8px;

      opacity: 0.75;

      font-size: 15px;
    }


    .success {

      background:
        rgba(41,164,91,0.18)
        !important;
    }


    .error {

      background:
        rgba(220,60,60,0.18)
        !important;
    }


    .error-message {

      color:
        #ff9494;

      font-size:
        24px;

      font-weight:
        bold;
    }


    .manual {

      margin-top:
        24px;

      padding-top:
        20px;

      border-top:
        1px solid
        rgba(255,255,255,0.2);
    }


    .manual-title {

      font-size:
        14px;

      opacity:
        0.65;

      margin-bottom:
        10px;
    }


    .manual-row {

      display:
        flex;

      gap:
        10px;

      justify-content:
        center;
    }


    input {

      flex:
        1;

      padding:
        12px;

      border:
        none;

      border-radius:
        8px;

      font-size:
        16px;
    }


    button {

      padding:
        12px 18px;

      border:
        none;

      border-radius:
        8px;

      cursor:
        pointer;

      background:
        white;

      color:
        #071a33;

      font-weight:
        bold;
    }


    #debug {

      margin-top:
        15px;

      font-family:
        monospace;

      font-size:
        12px;

      opacity:
        0.45;

      word-break:
        break-all;
    }


    @media
    (max-width: 600px) {

      h1 {
        font-size: 32px;
      }


      .manual-row {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <div class="logo">
    MODEL UNITED NATIONS
  </div>


  <h1>
    Check-In
  </h1>


  <div id="systemStatus">
    Starting camera...
  </div>



  <div class="camera-container">


    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-guide"></div>

    <div class="scan-line"></div>


  </div>



  <div class="instruction">

    Hold the barcode on your student ID
    inside the box.

  </div>



  <div id="result">

    Ready to scan.

  </div>



  <div class="manual">


    <div class="manual-title">
      ID not scanning? Enter it manually.
    </div>


    <div class="manual-row">


      <input
        id="manualId"
        type="text"
        placeholder="Student ID"
        autocomplete="off">


      <button
        id="manualButton"
        type="button">

        Check In

      </button>


    </div>


  </div>



  <div id="debug"></div>


</div>



<script type="module">


/***********************************************************
 * CONFIGURATION
 ***********************************************************/


// PUT YOUR APPS SCRIPT /exec URL HERE
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxwLRFPpqwTbtcsS5Zw0nzl_Y3WYrUbXvGX3Ar4zLI3NVjbJYZV17JAUGZTZCP1rQJRyg/exec";



/***********************************************************
 * IMPORT ZXING BARCODE READER
 ***********************************************************/


import {
  BrowserMultiFormatReader
}
from
"https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";



/***********************************************************
 * ELEMENTS
 ***********************************************************/


const video =
  document.getElementById(
    "video"
  );


const result =
  document.getElementById(
    "result"
  );


const status =
  document.getElementById(
    "systemStatus"
  );


const debug =
  document.getElementById(
    "debug"
  );


const manualId =
  document.getElementById(
    "manualId"
  );


const manualButton =
  document.getElementById(
    "manualButton"
  );



/***********************************************************
 * STATE
 ***********************************************************/


let scannerLocked =
  false;


let lastBarcode =
  "";


let lastBarcodeTime =
  0;


const barcodeReader =
  new BrowserMultiFormatReader();



/***********************************************************
 * START CAMERA
 ***********************************************************/


async function startScanner() {


  try {


    status.textContent =
      "Starting camera...";


    const devices =
      await BrowserMultiFormatReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "No camera found."
      );
    }


    /*
     * Usually the final camera in the list
     * is the rear camera on phones.
     *
     * On a laptop there may only be one.
     */

    const selectedDevice =
      devices[
        devices.length - 1
      ];


    status.textContent =
      "🟢 CHECK-IN READY";


    status.className =
      "ready";


    await barcodeReader
      .decodeFromVideoDevice(

        selectedDevice.deviceId,

        video,

        function(
          scanResult,
          error,
          controls
        ) {


          if (
            scanResult &&
            !scannerLocked
          ) {


            const value =
              String(
                scanResult.getText()
              ).trim();


            if (!value) {
              return;
            }


            const now =
              Date.now();


            /*
             * Prevent the camera from
             * reading the same card
             * dozens of times per second.
             */

            if (
              value === lastBarcode &&
              now - lastBarcodeTime < 5000
            ) {

              return;

            }


            lastBarcode =
              value;


            lastBarcodeTime =
              now;


            debug.textContent =
              "Detected barcode: " +
              value;


            processBarcode(
              value
            );

          }

        }

      );


  }

  catch(error) {


    console.error(
      error
    );


    status.textContent =
      "Camera unavailable";


    showError(
      "Camera could not be started. " +
      "You can still enter a Student ID manually."
    );

  }

}



/***********************************************************
 * SEND BARCODE TO GOOGLE APPS SCRIPT
 ***********************************************************/


function processBarcode(
  studentId
) {


  if (
    scannerLocked
  ) {

    return;
  }


  scannerLocked =
    true;


  result.className =
    "";


  result.innerHTML =
    "Checking ID...";


  /*
   * Generate a unique callback name.
   *
   * JSONP lets the GitHub-hosted scanner
   * communicate with Apps Script without
   * browser CORS problems.
   */


  const callbackName =
    "munCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[
    callbackName
  ] =
    function(data) {


      try {


        handleServerResult(
          data
        );


      }

      finally {


        delete window[
          callbackName
        ];


        script.remove();


      }

    };


  const script =
    document.createElement(
      "script"
    );


  const url =
    APPS_SCRIPT_URL +

    "?action=checkin" +

    "&id=" +
    encodeURIComponent(
      studentId
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&t=" +
    Date.now();


  script.src =
    url;


  script.onerror =
    function() {


      showError(
        "Could not connect to attendance system."
      );


      delete window[
        callbackName
      ];


      script.remove();


      unlockScanner();

    };


  document.body
    .appendChild(
      script
    );

}



/***********************************************************
 * SERVER RESPONSE
 ***********************************************************/


function handleServerResult(
  data
) {


  if (
    data &&
    data.success
  ) {


    const pointSign =
      Number(
        data.points
      ) >= 0
        ? "+"
        : "";


    result.className =
      "success";


    result.innerHTML =

      "<div class='student-name'>" +
      escapeHtml(
        data.name
      ) +
      "</div>" +

      "<div class='event'>" +
      escapeHtml(
        data.event
      ) +
      "</div>" +

      "<div class='points'>" +
      pointSign +
      escapeHtml(
        String(
          data.points
        )
      ) +
      " points</div>" +

      "<div class='timestamp'>" +
      escapeHtml(
        data.timestamp
      ) +
      "</div>";


    /*
     * Optional success sound
     */

    beep(
      880,
      100
    );


  }

  else {


    const name =
      data &&
      data.name
        ? escapeHtml(
            data.name
          ) +
          "<br>"
        : "";


    result.className =
      "error";


    result.innerHTML =

      "<div class='error-message'>" +

      name +

      escapeHtml(
        data &&
        data.message
          ? data.message
          : "Check-in failed."
      ) +

      "</div>";


    beep(
      250,
      180
    );

  }


  setTimeout(
    unlockScanner,
    2500
  );

}



/***********************************************************
 * RESET FOR NEXT STUDENT
 ***********************************************************/


function unlockScanner() {


  result.className =
    "";


  result.innerHTML =
    "Ready for next student.";


  manualId.value =
    "";


  scannerLocked =
    false;

}



/***********************************************************
 * MANUAL ID ENTRY
 ***********************************************************/


manualButton.addEventListener(
  "click",
  function() {


    const id =
      manualId.value.trim();


    if (!id) {


      showError(
        "Enter a Student ID."
      );


      return;

    }


    processBarcode(
      id
    );

  }
);



manualId.addEventListener(
  "keydown",
  function(event) {


    if (
      event.key === "Enter"
    ) {


      event.preventDefault();


      manualButton.click();

    }

  }
);



/***********************************************************
 * ERROR DISPLAY
 ***********************************************************/


function showError(
  message
) {


  result.className =
    "error";


  result.innerHTML =

    "<div class='error-message'>" +

    escapeHtml(
      message
    ) +

    "</div>";

}



/***********************************************************
 * BASIC SOUND
 ***********************************************************/


function beep(
  frequency,
  duration
) {


  try {


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator
      .connect(
        gain
      );


    gain
      .connect(
        audioContext.destination
      );


    oscillator.frequency.value =
      frequency;


    oscillator.start();


    gain.gain.setValueAtTime(
      0.08,
      audioContext.currentTime
    );


    oscillator.stop(
      audioContext.currentTime +
      duration / 1000
    );


  }

  catch(error) {

    /*
     * Sound is optional.
     */

  }

}



/***********************************************************
 * PREVENT HTML INJECTION
 ***********************************************************/


function escapeHtml(
  value
) {


  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/***********************************************************
 * START
 ***********************************************************/


startScanner();


</script>


</body>

</html>
