<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Model UN Barcode Diagnostic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #071a33;
      color: white;

      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b9c5d8;
      margin-bottom: 25px;
    }

    .status {
      padding: 12px;
      margin-bottom: 20px;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.08);
    }

    .camera-box {
      position: relative;

      width: 100%;

      background: black;

      border-radius: 15px;

      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;

      max-height: 520px;

      object-fit: cover;
    }

    .guide {
      position: absolute;

      top: 10%;
      bottom: 10%;

      left: 38%;
      right: 38%;

      border:
        3px solid white;

      border-radius: 10px;

      pointer-events: none;
    }

    .guide-text {
      position: absolute;

      bottom: 14px;

      width: 100%;

      text-align: center;

      font-weight: bold;

      text-shadow:
        0 2px 5px black;
    }

    .controls {
      display: flex;

      gap: 10px;

      margin-top: 18px;

      flex-wrap: wrap;

      justify-content: center;
    }

    select,
    button {
      padding: 11px 15px;

      border: none;

      border-radius: 8px;

      font-size: 16px;
    }

    button {
      cursor: pointer;

      background: white;
      color: #071a33;

      font-weight: bold;
    }

    .result {
      margin-top: 25px;

      padding: 25px;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.08);

      min-height: 130px;
    }

    .detected {
      background:
        rgba(32,180,95,0.20);
    }

    .big {
      font-size: 30px;
      font-weight: bold;

      margin-bottom: 10px;
    }

    .value {
      font-family: monospace;

      font-size: 24px;

      word-break: break-all;

      margin-top: 10px;
    }

    .debug {
      margin-top: 25px;

      padding: 18px;

      text-align: left;

      background: #020a15;

      border-radius: 10px;

      font-family: monospace;

      font-size: 13px;

      white-space: pre-wrap;

      max-height: 300px;

      overflow-y: auto;
    }

    canvas {
      display: none;
    }

    @media (max-width: 600px) {

      .guide {
        left: 34%;
        right: 34%;
      }

    }
  </style>
</head>


<body>

<div class="container">

  <h1>
    Model UN Barcode Diagnostic
  </h1>

  <div class="subtitle">
    This page tests your school ID barcode only.
    Nothing is sent to Google Sheets.
  </div>


  <div
    id="status"
    class="status">

    Waiting to start...

  </div>


  <div class="camera-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div class="guide"></div>

    <div class="guide-text">
      Hold barcode inside this vertical box
    </div>

  </div>


  <div class="controls">

    <select id="cameraSelect">
      <option>
        Loading cameras...
      </option>
    </select>

    <button
      id="startButton"
      type="button">

      Start Camera

    </button>

    <button
      id="stopButton"
      type="button">

      Stop

    </button>

  </div>


  <div
    id="result"
    class="result">

    No barcode detected yet.

  </div>


  <div
    id="debug"
    class="debug">

Diagnostic log:

  </div>


  <canvas id="canvas0"></canvas>
  <canvas id="canvas90"></canvas>

</div>


<script>

const video =
  document.getElementById("video");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const debugBox =
  document.getElementById("debug");

const cameraSelect =
  document.getElementById("cameraSelect");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const canvas0 =
  document.getElementById("canvas0");

const canvas90 =
  document.getElementById("canvas90");


let stream = null;
let detector = null;
let scanning = false;
let scanTimer = null;
let lastDetectedValue = "";


function log(message) {

  const time =
    new Date()
      .toLocaleTimeString();

  debugBox.textContent +=
    "\n[" +
    time +
    "] " +
    message;

  debugBox.scrollTop =
    debugBox.scrollHeight;
}



async function initialize() {

  log(
    "Browser: " +
    navigator.userAgent
  );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    statusBox.textContent =
      "❌ This browser does not provide camera access.";

    log(
      "navigator.mediaDevices.getUserMedia unavailable."
    );

    return;
  }


  if (
    !("BarcodeDetector" in window)
  ) {

    statusBox.textContent =
      "❌ BarcodeDetector is not supported by this browser.";

    log(
      "Native BarcodeDetector API unavailable."
    );

    log(
      "If you are using Chrome, make sure it is updated."
    );

    return;
  }


  try {

    const supportedFormats =
      await BarcodeDetector
        .getSupportedFormats();


    log(
      "Supported barcode formats:"
    );

    log(
      supportedFormats.join(", ")
    );


    const wantedFormats = [

      "code_128",
      "code_39",
      "code_93",
      "codabar",
      "ean_13",
      "ean_8",
      "itf",
      "upc_a",
      "upc_e"

    ];


    const usableFormats =
      wantedFormats.filter(
        format =>
          supportedFormats.includes(
            format
          )
      );


    if (
      usableFormats.length === 0
    ) {

      statusBox.textContent =
        "❌ Browser supports barcode scanning, but no useful 1D formats.";

      log(
        "No compatible 1D barcode formats found."
      );

      return;
    }


    detector =
      new BarcodeDetector({
        formats: usableFormats
      });


    log(
      "Detector initialized with:"
    );

    log(
      usableFormats.join(", ")
    );


    await requestCameraPermission();

  }

  catch(error) {

    statusBox.textContent =
      "❌ Detector initialization failed.";

    log(
      "Initialization error: " +
      error
    );
  }

}



async function requestCameraPermission() {

  try {

    const temporaryStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: true,
          audio: false

        });


    temporaryStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    log(
      "Camera permission granted."
    );


    await loadCameraList();


    statusBox.textContent =
      "Camera permission granted. Press Start Camera.";

  }

  catch(error) {

    statusBox.textContent =
      "❌ Camera permission denied.";

    log(
      "Camera permission error: " +
      error
    );
  }

}



async function loadCameraList() {

  const devices =
    await navigator.mediaDevices
      .enumerateDevices();


  const cameras =
    devices.filter(
      device =>
        device.kind ===
        "videoinput"
    );


  cameraSelect.innerHTML =
    "";


  if (
    cameras.length === 0
  ) {

    cameraSelect.innerHTML =
      "<option>No cameras found</option>";

    log(
      "No video input devices found."
    );

    return;
  }


  cameras.forEach(
    (camera, index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        camera.deviceId;


      option.textContent =
        camera.label ||
        "Camera " +
        (index + 1);


      cameraSelect
        .appendChild(
          option
        );

    }
  );


  log(
    cameras.length +
    " camera(s) found."
  );

}



async function startCamera() {

  stopCamera();


  const deviceId =
    cameraSelect.value;


  try {

    const constraints = {

      audio: false,

      video: {

        deviceId:
          deviceId
            ? {
                exact:
                  deviceId
              }
            : undefined,

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        frameRate: {
          ideal: 30
        }

      }

    };


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    const track =
      stream
        .getVideoTracks()[0];


    const settings =
      track.getSettings();


    log(
      "Camera started."
    );


    log(
      "Resolution: " +
      settings.width +
      " × " +
      settings.height
    );


    if (
      settings.frameRate
    ) {

      log(
        "Frame rate: " +
        settings.frameRate
      );
    }


    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    if (
      capabilities.focusMode
    ) {

      log(
        "Focus modes: " +
        capabilities.focusMode.join(
          ", "
        )
      );
    }


    /*
     * Try continuous autofocus
     * if the camera supports it.
     */

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      try {

        await track.applyConstraints({

          advanced: [
            {
              focusMode:
                "continuous"
            }
          ]

        });


        log(
          "Continuous autofocus enabled."
        );

      }

      catch(error) {

        log(
          "Could not enable autofocus: " +
          error
        );
      }

    }


    scanning =
      true;


    statusBox.textContent =
      "🟢 SCANNING — hold ID barcode in the box";


    scanLoop();

  }

  catch(error) {

    statusBox.textContent =
      "❌ Could not start camera.";

    log(
      "Camera error: " +
      error
    );
  }

}



function stopCamera() {

  scanning =
    false;


  if (
    scanTimer
  ) {

    clearTimeout(
      scanTimer
    );

    scanTimer =
      null;
  }


  if (
    stream
  ) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    stream =
      null;
  }


  video.srcObject =
    null;

}



async function scanLoop() {

  if (
    !scanning
  ) {

    return;
  }


  try {

    if (
      video.readyState >= 2 &&
      video.videoWidth > 0
    ) {

      /*
       * Test original camera orientation.
       */

      const directResults =
        await detector.detect(
          video
        );


      if (
        directResults.length > 0
      ) {

        handleBarcode(
          directResults[0],
          "original frame"
        );

      }

      else {

        /*
         * Also create a 90° rotated frame.
         *
         * This specifically helps with
         * vertically printed school ID
         * barcodes.
         */

        const rotated =
          createRotatedFrame();


        const rotatedResults =
          await detector.detect(
            rotated
          );


        if (
          rotatedResults.length > 0
        ) {

          handleBarcode(
            rotatedResults[0],
            "90° rotated frame"
          );
        }

      }

    }

  }

  catch(error) {

    log(
      "Scan error: " +
      error
    );

  }


  scanTimer =
    setTimeout(
      scanLoop,
      150
    );

}



function createRotatedFrame() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  canvas90.width =
    height;

  canvas90.height =
    width;


  const ctx =
    canvas90.getContext(
      "2d"
    );


  ctx.save();


  ctx.translate(
    height,
    0
  );


  ctx.rotate(
    Math.PI / 2
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  return canvas90;

}



function handleBarcode(
  barcode,
  method
) {

  const value =
    String(
      barcode.rawValue || ""
    ).trim();


  if (!value) {
    return;
  }


  if (
    value ===
    lastDetectedValue
  ) {

    return;
  }


  lastDetectedValue =
    value;


  resultBox.className =
    "result detected";


  resultBox.innerHTML =

    "<div class='big'>" +
    "✓ BARCODE DETECTED" +
    "</div>" +

    "<div>" +
    "<strong>Format:</strong> " +
    escapeHtml(
      barcode.format
    ) +
    "</div>" +

    "<div>" +
    "<strong>Method:</strong> " +
    escapeHtml(
      method
    ) +
    "</div>" +

    "<div class='value'>" +
    escapeHtml(
      value
    ) +
    "</div>";


  statusBox.textContent =
    "✅ Barcode successfully decoded";


  log(
    "SUCCESS"
  );


  log(
    "Format: " +
    barcode.format
  );


  log(
    "Value: " +
    value
  );


  log(
    "Detected using: " +
    method
  );

}



function escapeHtml(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



startButton
  .addEventListener(
    "click",
    startCamera
  );


stopButton
  .addEventListener(
    "click",
    function() {

      stopCamera();

      statusBox.textContent =
        "Scanner stopped.";

      log(
        "Scanner stopped."
      );

    }
  );


initialize();

</script>

</body>

</html>
