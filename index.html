<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Model UN Check-In</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #071a33;

      color:
        white;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      padding:
        24px;

    }


    .container {

      width:
        100%;

      max-width:
        850px;

      text-align:
        center;

    }


    .club-label {

      letter-spacing:
        4px;

      opacity:
        0.65;

      font-size:
        15px;

      margin-bottom:
        7px;

    }


    h1 {

      margin:
        0 0 10px 0;

      font-size:
        42px;

    }


    #status {

      margin-bottom:
        20px;

      font-size:
        18px;

      font-weight:
        bold;

    }


    .ready {

      color:
        #70e89e;

    }


    .busy {

      color:
        #ffd166;

    }


    .camera-box {

      position:
        relative;

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        18px;

      background:
        black;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

    }


    video {

      display:
        block;

      width:
        100%;

      max-height:
        520px;

      object-fit:
        cover;

    }


    /*
     * Your school's barcode is vertical
     * on the physical ID.
     */

    .scan-guide {

      position:
        absolute;

      top:
        8%;

      bottom:
        8%;

      left:
        37%;

      right:
        37%;

      border:
        3px solid
        rgba(
          255,
          255,
          255,
          0.95
        );

      border-radius:
        12px;

      pointer-events:
        none;

    }


    .scan-line {

      position:
        absolute;

      top:
        12%;

      bottom:
        12%;

      left:
        50%;

      width:
        3px;

      background:
        #ff5252;

      box-shadow:
        0 0 10px
        rgba(
          255,
          82,
          82,
          0.8
        );

      pointer-events:
        none;

    }


    .instruction {

      margin-top:
        15px;

      font-size:
        18px;

      opacity:
        0.85;

    }


    #result {

      margin-top:
        22px;

      min-height:
        135px;

      padding:
        22px;

      border-radius:
        14px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      transition:
        background 0.2s ease;

    }


    .success {

      background:
        rgba(
          38,
          180,
          90,
          0.22
        ) !important;

    }


    .error {

      background:
        rgba(
          220,
          55,
          55,
          0.22
        ) !important;

    }


    .student-name {

      font-size:
        34px;

      font-weight:
        bold;

      margin-bottom:
        7px;

    }


    .event-name {

      font-size:
        20px;

      margin-bottom:
        7px;

    }


    .points {

      font-size:
        36px;

      font-weight:
        bold;

      color:
        #70e89e;

    }


    .timestamp {

      margin-top:
        8px;

      opacity:
        0.7;

      font-size:
        15px;

    }


    .error-title {

      font-size:
        27px;

      font-weight:
        bold;

      color:
        #ff9999;

    }


    .error-name {

      font-size:
        20px;

      margin-bottom:
        7px;

    }


    .manual-section {

      margin-top:
        24px;

      padding-top:
        18px;

      border-top:
        1px solid
        rgba(
          255,
          255,
          255,
          0.16
        );

    }


    .manual-label {

      font-size:
        14px;

      opacity:
        0.6;

      margin-bottom:
        9px;

    }


    .manual-row {

      display:
        flex;

      gap:
        10px;

    }


    input {

      flex:
        1;

      min-width:
        0;

      padding:
        12px;

      border:
        none;

      border-radius:
        8px;

      font-size:
        16px;

    }


    button {

      padding:
        12px 18px;

      border:
        none;

      border-radius:
        8px;

      background:
        white;

      color:
        #071a33;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    button:disabled {

      opacity:
        0.4;

      cursor:
        not-allowed;

    }


    .small-status {

      margin-top:
        12px;

      font-size:
        12px;

      opacity:
        0.4;

    }


    @media (
      max-width: 600px
    ) {

      h1 {
        font-size:
          32px;
      }


      .scan-guide {

        left:
          33%;

        right:
          33%;

      }


      .manual-row {

        flex-direction:
          column;

      }

    }

  </style>

</head>



<body>


<div class="container">


  <div class="club-label">
    MODEL UNITED NATIONS
  </div>


  <h1>
    Check-In
  </h1>


  <div
    id="status"
    class="busy">

    Starting camera...

  </div>



  <div class="camera-box">


    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>


    <div class="scan-guide"></div>


    <div class="scan-line"></div>


  </div>



  <div class="instruction">

    Hold your student ID barcode
    inside the box.

  </div>



  <div id="result">

    Initializing scanner...

  </div>



  <div class="manual-section">


    <div class="manual-label">

      ID not scanning?
      Enter the Student ID manually.

    </div>


    <div class="manual-row">


      <input
        id="manualId"
        type="text"
        placeholder="Student ID"
        autocomplete="off">


      <button
        id="manualButton"
        type="button">

        Check In

      </button>


    </div>


  </div>



  <div class="small-status">

    Code 39 scanner

  </div>


</div>



<script>


/***********************************************************
 * CONFIGURATION
 ***********************************************************/


// ---------------------------------------------------------
// PASTE YOUR GOOGLE APPS SCRIPT /exec URL BELOW
// ---------------------------------------------------------

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxwLRFPpqwTbtcsS5Zw0nzl_Y3WYrUbXvGX3Ar4zLI3NVjbJYZV17JAUGZTZCP1rQJRyg/exec";


// How long the success/error result stays visible.
const RESULT_DISPLAY_MS =
  2500;


// Minimum delay before accepting another physical scan.
const SCAN_COOLDOWN_MS =
  3200;


// Delay between camera detection attempts.
const DETECTION_INTERVAL_MS =
  120;



/***********************************************************
 * ELEMENTS
 ***********************************************************/


const video =
  document.getElementById(
    "video"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const manualId =
  document.getElementById(
    "manualId"
  );


const manualButton =
  document.getElementById(
    "manualButton"
  );



/***********************************************************
 * STATE
 ***********************************************************/


let detector =
  null;


let stream =
  null;


let scannerLocked =
  false;


let scanning =
  false;


let lastAcceptedScan =
  0;


let lastBarcode =
  null;


let lastBarcodeSeenAt =
  0;



/***********************************************************
 * INITIALIZE SCANNER
 ***********************************************************/


async function initializeScanner() {


  // -------------------------------------------------------
  // VERIFY CAMERA SUPPORT
  // -------------------------------------------------------

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {


    scannerError(
      "Camera access is not supported by this browser."
    );


    return;

  }


  // -------------------------------------------------------
  // VERIFY BARCODE API
  // -------------------------------------------------------

  if (
    !("BarcodeDetector" in window)
  ) {


    scannerError(
      "Barcode scanning is not supported by this browser."
    );


    return;

  }


  try {


    const formats =
      await BarcodeDetector
        .getSupportedFormats();


    if (
      !formats.includes(
        "code_39"
      )
    ) {


      scannerError(
        "This browser does not support Code 39 barcodes."
      );


      return;

    }


    /*
     * IMPORTANT:
     *
     * We now know the school IDs use Code 39,
     * so only scan for Code 39.
     *
     * This reduces unnecessary work and
     * improves reliability.
     */

    detector =
      new BarcodeDetector({

        formats: [
          "code_39"
        ]

      });


    await startCamera();


  }

  catch(error) {


    console.error(
      error
    );


    scannerError(
      "Scanner could not be initialized."
    );

  }

}



/***********************************************************
 * START CAMERA
 ***********************************************************/


async function startCamera() {


  try {


    const constraints = {

      audio:
        false,

      video: {

        width: {
          ideal:
            1920
        },

        height: {
          ideal:
            1080
        },

        frameRate: {
          ideal:
            30
        }

      }

    };


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();



    /*******************************************************
     * TRY TO ENABLE CONTINUOUS AUTOFOCUS
     *******************************************************/


    const track =
      stream
        .getVideoTracks()[0];


    if (
      track &&
      track.getCapabilities
    ) {


      const capabilities =
        track.getCapabilities();


      if (
        capabilities.focusMode &&
        capabilities.focusMode.includes(
          "continuous"
        )
      ) {


        try {


          await track.applyConstraints({

            advanced: [
              {
                focusMode:
                  "continuous"
              }
            ]

          });


        }

        catch(error) {


          /*
           * Autofocus is useful but optional.
           */

          console.log(
            "Continuous autofocus unavailable."
          );

        }

      }

    }



    /*******************************************************
     * READY
     *******************************************************/


    scanning =
      true;


    showReady();


    scanLoop();


  }

  catch(error) {


    console.error(
      error
    );


    scannerError(
      "Could not access the camera. Check browser camera permissions."
    );

  }

}



/***********************************************************
 * CAMERA SCANNING LOOP
 ***********************************************************/


async function scanLoop() {


  if (
    !scanning
  ) {

    return;

  }


  try {


    if (
      !scannerLocked &&
      video.readyState >= 2 &&
      video.videoWidth > 0
    ) {


      const barcodes =
        await detector.detect(
          video
        );


      if (
        barcodes.length > 0
      ) {


        const barcode =
          barcodes[0];


        const value =
          String(
            barcode.rawValue || ""
          ).trim();


        if (value) {


          handleDetectedBarcode(
            value
          );

        }

      }

    }


  }

  catch(error) {


    /*
     * Individual frame failures aren't fatal.
     *
     * Keep scanning.
     */

    console.log(
      "Frame scan failed:",
      error
    );

  }


  setTimeout(
    scanLoop,
    DETECTION_INTERVAL_MS
  );

}



/***********************************************************
 * HANDLE PHYSICAL BARCODE DETECTION
 ***********************************************************/


function handleDetectedBarcode(
  studentId
) {


  const now =
    Date.now();


  /*
   * Keep track of the barcode currently visible.
   */

  if (
    studentId === lastBarcode
  ) {


    lastBarcodeSeenAt =
      now;


  }

  else {


    lastBarcode =
      studentId;


    lastBarcodeSeenAt =
      now;

  }


  /*
   * Ignore scans while processing another card.
   */

  if (
    scannerLocked
  ) {

    return;

  }


  /*
   * Global short cooldown.
   */

  if (
    now -
    lastAcceptedScan <
    SCAN_COOLDOWN_MS
  ) {

    return;

  }


  lastAcceptedScan =
    now;


  processCheckIn(
    studentId
  );

}



/***********************************************************
 * PROCESS CHECK-IN
 ***********************************************************/


function processCheckIn(
  studentId
) {


  if (
    scannerLocked
  ) {

    return;

  }


  scannerLocked =
    true;


  manualButton.disabled =
    true;


  statusBox.className =
    "busy";


  statusBox.textContent =
    "Processing...";


  resultBox.className =
    "";


  resultBox.innerHTML =
    "Checking student ID...";


  sendToAppsScript(
    studentId
  );

}



/***********************************************************
 * SEND REQUEST TO GOOGLE APPS SCRIPT
 *
 * Uses JSONP because the scanner is hosted on GitHub Pages.
 ***********************************************************/


function sendToAppsScript(
  studentId
) {


  const callbackName =

    "munScanner_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() *
      100000
    );



  const script =
    document.createElement(
      "script"
    );



  window[
    callbackName
  ] =
    function(data) {


      try {


        handleServerResult(
          data
        );


      }

      finally {


        delete window[
          callbackName
        ];


        script.remove();


      }

    };



  const url =

    APPS_SCRIPT_URL +

    "?action=checkin" +

    "&id=" +
    encodeURIComponent(
      studentId
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&t=" +
    Date.now();



  script.src =
    url;



  script.onerror =
    function() {


      delete window[
        callbackName
      ];


      script.remove();


      showFailure(
        "",
        "Could not connect to attendance system."
      );


      scheduleReset();

    };



  document.body
    .appendChild(
      script
    );

}



/***********************************************************
 * HANDLE GOOGLE RESPONSE
 ***********************************************************/


function handleServerResult(
  data
) {


  if (
    data &&
    data.success
  ) {


    showSuccess(
      data
    );


    playSuccessSound();


  }

  else {


    showFailure(

      data &&
      data.name
        ? data.name
        : "",

      data &&
      data.message
        ? data.message
        : "Check-in failed."

    );


    playErrorSound();

  }


  scheduleReset();

}



/***********************************************************
 * SUCCESS DISPLAY
 ***********************************************************/


function showSuccess(
  data
) {


  const sign =
    Number(
      data.points
    ) >= 0
      ? "+"
      : "";


  resultBox.className =
    "success";


  resultBox.innerHTML =

    "<div class='student-name'>" +

      escapeHtml(
        data.name
      ) +

    "</div>" +


    "<div class='event-name'>" +

      escapeHtml(
        data.event
      ) +

    "</div>" +


    "<div class='points'>" +

      sign +

      escapeHtml(
        String(
          data.points
        )
      ) +

      " points" +

    "</div>" +


    "<div class='timestamp'>" +

      escapeHtml(
        data.timestamp
      ) +

    "</div>";


  statusBox.className =
    "ready";


  statusBox.textContent =
    "✓ CHECK-IN COMPLETE";

}



/***********************************************************
 * FAILURE DISPLAY
 ***********************************************************/


function showFailure(
  name,
  message
) {


  resultBox.className =
    "error";


  let html =
    "";


  if (name) {


    html +=

      "<div class='error-name'>" +

        escapeHtml(
          name
        ) +

      "</div>";

  }


  html +=

    "<div class='error-title'>" +

      escapeHtml(
        message
      ) +

    "</div>";


  resultBox.innerHTML =
    html;


  statusBox.className =
    "busy";


  statusBox.textContent =
    "CHECK-IN NOT RECORDED";

}



/***********************************************************
 * RESET SCANNER
 ***********************************************************/


function scheduleReset() {


  setTimeout(
    function() {


      resultBox.className =
        "";


      resultBox.innerHTML =
        "Ready for next student.";


      manualId.value =
        "";


      manualButton.disabled =
        false;


      scannerLocked =
        false;


      showReady();


    },

    RESULT_DISPLAY_MS

  );

}



/***********************************************************
 * READY STATE
 ***********************************************************/


function showReady() {


  statusBox.className =
    "ready";


  statusBox.textContent =
    "● READY TO SCAN";

}



/***********************************************************
 * SCANNER ERROR
 ***********************************************************/


function scannerError(
  message
) {


  statusBox.className =
    "busy";


  statusBox.textContent =
    "Scanner unavailable";


  resultBox.className =
    "error";


  resultBox.innerHTML =

    "<div class='error-title'>" +

      escapeHtml(
        message
      ) +

    "</div>";

}



/***********************************************************
 * MANUAL STUDENT ID
 ***********************************************************/


manualButton
  .addEventListener(
    "click",
    function() {


      const id =
        manualId.value.trim();


      if (!id) {


        showFailure(
          "",
          "Enter a Student ID."
        );


        return;

      }


      processCheckIn(
        id
      );

    }
  );



manualId
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {


        event.preventDefault();


        manualButton.click();

      }

    }
  );



/***********************************************************
 * SUCCESS SOUND
 ***********************************************************/


function playSuccessSound() {


  playToneSequence([
    {
      frequency:
        660,
      duration:
        90
    },
    {
      frequency:
        880,
      duration:
        140
    }
  ]);

}



/***********************************************************
 * ERROR SOUND
 ***********************************************************/


function playErrorSound() {


  playToneSequence([
    {
      frequency:
        300,
      duration:
        180
    },
    {
      frequency:
        220,
      duration:
        180
    }
  ]);

}



/***********************************************************
 * SOUND ENGINE
 ***********************************************************/


function playToneSequence(
  tones
) {


  try {


    const AudioContextClass =

      window.AudioContext ||

      window.webkitAudioContext;


    if (
      !AudioContextClass
    ) {

      return;

    }


    const context =
      new AudioContextClass();


    let startTime =
      context.currentTime;


    tones.forEach(
      function(tone) {


        const oscillator =
          context.createOscillator();


        const gain =
          context.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          tone.frequency;


        oscillator.connect(
          gain
        );


        gain.connect(
          context.destination
        );


        gain.gain.setValueAtTime(
          0.08,
          startTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          startTime +
          tone.duration /
          1000
        );


        oscillator.start(
          startTime
        );


        oscillator.stop(
          startTime +
          tone.duration /
          1000
        );


        startTime +=
          tone.duration /
          1000 +
          0.04;

      }
    );


    setTimeout(
      function() {

        context.close();

      },
      1000
    );


  }

  catch(error) {


    /*
     * Sound is optional.
     */

    console.log(
      "Audio unavailable."
    );

  }

}



/***********************************************************
 * HTML SAFETY
 ***********************************************************/


function escapeHtml(
  value
) {


  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/***********************************************************
 * START SYSTEM
 ***********************************************************/


initializeScanner();


</script>


</body>

</html>
